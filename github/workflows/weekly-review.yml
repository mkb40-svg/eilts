name: Итоги недели

on:
  schedule:
    - cron: "0 16 * * 0"   # воскресенье, 16:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: progress-write
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r agent/requirements.txt
      - name: Отчёт за неделю
        run: python -m ielts_agent weekly
        env:
          PYTHONPATH: agent/src
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_FOUNDRY_API_KEY: ${{ secrets.ANTHROPIC_FOUNDRY_API_KEY }}
          ANTHROPIC_FOUNDRY_RESOURCE: ${{ vars.ANTHROPIC_FOUNDRY_RESOURCE }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - name: Сохранить отчёт
        run: |
          git config user.name "ielts-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in progress plan PROGRESS.md; do [ -e "$p" ] && git add -A -- "$p"; done
          if git diff --cached --quiet; then echo "Нет изменений"; exit 0; fi
          git commit -m "agent: итоги недели"
          for i in 1 2 3; do git pull --rebase --autostash && git push && exit 0; sleep $((i * 5)); done
          exit 1
