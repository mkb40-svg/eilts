name: Тесты и проверка материалов

on:
  push:
    branches: [main]
    paths-ignore: ["progress/**", "plan/**", "submissions/**", "PROGRESS.md"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r agent/requirements.txt pytest==9.2.0
      - name: Проверить материалы (лицензии, ключи, цитаты)
        run: python -m ielts_agent validate
        env:
          PYTHONPATH: agent/src
      - name: Тесты
        run: python -m pytest -q
