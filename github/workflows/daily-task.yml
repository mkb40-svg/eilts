name: Задание на день

on:
  schedule:
    # Время в UTC. 04:00 UTC = 07:00 в поясе UTC+3, 09:00 в поясе UTC+5.
    # Поменяйте одну строку под свой часовой пояс: https://crontab.guru
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: progress-write
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r agent/requirements.txt
      - name: Выбрать и выдать задание
        run: python -m ielts_agent daily
        env:
          PYTHONPATH: agent/src
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
