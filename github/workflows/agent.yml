name: Агент — проверка и ответы

# Анкета «Старт», работы Writing/Reading, ответы комментарием на задание дня, вопросы (@claude).
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

# Все записи в progress/ идут по очереди, чтобы коммиты не конфликтовали.
concurrency:
  group: progress-write
  cancel-in-progress: false

jobs:
  agent:
    # Только владелец репозитория: чужие Issues в публичном репозитории не тратят бюджет на ИИ.
    if: >-
      github.event.sender.login == github.repository_owner &&
      github.event.sender.type != 'Bot' &&
      !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r agent/requirements.txt

      # Текст Issue агент читает из файла события (GITHUB_EVENT_PATH), а не из подстановок в shell.
      - name: Обработать событие
        run: python -m ielts_agent event
        env:
          PYTHONPATH: agent/src
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_FOUNDRY_API_KEY: ${{ secrets.ANTHROPIC_FOUNDRY_API_KEY }}
          ANTHROPIC_FOUNDRY_RESOURCE: ${{ vars.ANTHROPIC_FOUNDRY_RESOURCE }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Сохранить результаты в репозиторий
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "ielts-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in progress plan submissions PROGRESS.md; do [ -e "$p" ] && git add -A -- "$p"; done
          if git diff --cached --quiet; then echo "Нет изменений"; exit 0; fi
          git commit -m "agent: проверка (#${ISSUE_NUMBER})"
          for i in 1 2 3; do git pull --rebase --autostash && git push && exit 0; sleep $((i * 5)); done
          exit 1
