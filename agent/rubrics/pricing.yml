# Цены Anthropic API, USD за 1 млн токенов (по прайсу на ноябрь 2026).
# Перед запуском сверьте с актуальным прайсом: от этих чисел зависит лимит budget_usd_month.
# cache_read — чтение из кэша промпта, cache_write — запись в кэш (5 минут).

claude-opus-5-5:
  input: 4.00
  output: 20.00
  cache_read: 0.20
  cache_write: 5.00
claude-sonnet-5-5:
  input: 2.00
  output: 10.00
  cache_read: 0.10
  cache_write: 2.50
claude-haiku-5-5:
  input: 0.10
  output: 0.50
  cache_read: 0.01     # оценка: 10% от цены входа
  cache_write: 0.125

# Модели других провайдеров (Azure OpenAI, Grok, DeepSeek) добавьте сами по их прайсу,
# ключ — точное имя модели из config.yml. Без цены расход считается как 0 и лимит бюджета
# для этой модели не работает (в progress/usage.jsonl будет price_known: false).
# пример-модели:
#   input: 0.30
#   output: 1.20
#   cache_read: 0.03
