# Цены Anthropic API, USD за 1 млн токенов (по прайсу на ноябрь 2026).
# Перед запуском сверьте с актуальным прайсом: от этих чисел зависит лимит budget_usd_month.
# cache_read — чтение из кэша промпта, cache_write — запись в кэш (5 минут).

claude-opus-5-5:
  input: 4.00
  output: 20.00
  cache_read: 0.20
  cache_write: 5.00
claude-sonnet-5-5:
  input: 2.00
  output: 10.00
  cache_read: 0.10
  cache_write: 2.50
claude-haiku-5-5:
  input: 0.10
  output: 0.50
  cache_read: 0.01     # оценка: 10% от цены входа
  cache_write: 0.125

# Модели в Azure (Global Standard). Цены — по сторонним трекерам цен Azure на ноябрь 2026;
# сверьте в портале Azure (Cost Management или карточка модели) и поправьте при необходимости.
# Имя — как развёртывание в config.yml (регистр не важен).
DeepSeek-V4-Pro:
  input: 1.74
  output: 3.48
  cache_read: 1.74     # по данным трекеров Azure кэш отдельно не дисконтирует
grok-4.6:
  input: 2.00
  output: 6.00
  cache_read: 0.50

# Другие модели добавьте так же. Без цены расход считается как 0 и лимит бюджета
# для этой модели не работает (в progress/usage.jsonl будет price_known: false).
